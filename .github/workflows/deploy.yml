name: Deploy

on:
  schedule:
    - cron: '7 * * * *' # every hour; skipped quickly when Notion is unchanged
  push:
    branches: [main]
  workflow_dispatch: # "Run workflow" button = update now
    inputs:
      ig_add:
        description: 'Instagram posts to add: "URL => TAB" (one per line or ;). Without a tab the hashtags decide.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE_URL: https://${{ github.repository_owner }}.github.io

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Instagram posts shared to the Notion INBOX move to their archive by hashtag (docs/INSTAGRAM.ko.md).
      # Never blocks the site update.
      - name: Instagram → Notion
        continue-on-error: true
        run: npx tsx scripts/ig-to-notion.ts
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          IG_ADD: ${{ inputs.ig_add }}

      # Instagram tokens last 60 days: renew once a day and store the new one (needs GH_SECRETS_TOKEN).
      - name: Renew Instagram token
        if: github.event_name != 'push'
        continue-on-error: true
        run: |
          if [ -z "$IG_TOKEN" ] || [ -z "$GH_TOKEN" ]; then echo "Token renewal is off."; exit 0; fi
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%H)" != "03" ]; then echo "Renews daily at 03 UTC."; exit 0; fi
          npx tsx scripts/ig-to-notion.ts --refresh
          gh secret set IG_TOKEN --repo "$GITHUB_REPOSITORY" < "$IG_TOKEN_OUT"
          rm -f "$IG_TOKEN_OUT"
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
          IG_TOKEN_OUT: ${{ runner.temp }}/ig_token

      - name: Check whether Notion changed
        id: check
        if: github.event_name == 'schedule'
        run: npm run sync -- --check "$SITE_URL/sync-hash.txt"
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}

      - name: Decide
        id: decide
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "${{ steps.check.outputs.changed }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Notion unchanged — nothing to deploy."
          fi

      # Heavy Notion videos are re-encoded during the sync (src/lib/notion/video-optimize.ts).
      - name: Install ffmpeg
        if: steps.decide.outputs.run == 'true'
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Sync from Notion
        if: steps.decide.outputs.run == 'true'
        run: npm run sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}

      - name: Unit tests
        if: steps.decide.outputs.run == 'true'
        run: npm test

      - name: Install browser
        if: steps.decide.outputs.run == 'true'
        run: npx playwright install --with-deps chromium

      - name: Build and check pages
        if: steps.decide.outputs.run == 'true'
        run: npx playwright test
        env:
          CI: 'true'

      - uses: actions/upload-pages-artifact@v5
        if: steps.decide.outputs.run == 'true'
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
