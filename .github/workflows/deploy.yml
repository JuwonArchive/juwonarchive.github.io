name: Deploy

on:
  schedule:
    - cron: '7 * * * *' # every hour; skipped quickly when Notion is unchanged
  push:
    branches: [main]
  workflow_dispatch: # "Run workflow" button = update now

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE_URL: https://${{ github.repository_owner }}.github.io

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Check whether Notion changed
        id: check
        if: github.event_name == 'schedule'
        run: npm run sync -- --check "$SITE_URL/sync-hash.txt"
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}

      - name: Decide
        id: decide
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "${{ steps.check.outputs.changed }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Notion unchanged — nothing to deploy."
          fi

      - name: Sync from Notion
        if: steps.decide.outputs.run == 'true'
        run: npm run sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}

      - name: Unit tests
        if: steps.decide.outputs.run == 'true'
        run: npm test

      - name: Install browser
        if: steps.decide.outputs.run == 'true'
        run: npx playwright install --with-deps chromium

      - name: Build and check pages
        if: steps.decide.outputs.run == 'true'
        run: npx playwright test
        env:
          CI: 'true'

      - uses: actions/upload-pages-artifact@v5
        if: steps.decide.outputs.run == 'true'
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
